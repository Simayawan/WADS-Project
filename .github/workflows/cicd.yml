name: HAQ App CI/CD

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
        run: npx prisma generate

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm test || true

  deploy:
    needs: quality
    runs-on: self-hosted
    env:
      DOCKER_HOST: unix:///run/user/1064/docker.sock
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env.production from GitHub Secrets
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OCR_API_KEY=${{ secrets.OCR_API_KEY }}
          EOF

      - name: Build and Deploy
        env:
          DOCKER_HOST: unix:///run/user/1064/docker.sock
        run: |
          docker compose up -d --build

      - name: Remove temporary env file
        if: always()
        run: rm -f .env.production

      - name: Cleanup dangling images
        env:
          DOCKER_HOST: unix:///run/user/1064/docker.sock
        run: docker image prune -f