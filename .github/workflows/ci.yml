name: Project Build Check

# 1. Trigger: Run this every time code is pushed to 'main'
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest # The virtual machine GitHub provides

    steps:
      # Step 1: Copy your code onto the GitHub machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js (Version 20 to match your Docker)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies (with your legacy flag)
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Generate Prisma (Critical for your project!)
      - name: Prisma Generate
        run: npx prisma generate

      # Step 5: The Build Test
      - name: Run Next.js Build
        run: npm run build